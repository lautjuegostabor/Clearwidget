name: ClearWidget
options:
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.5.2'
    CURRENT_PROJECT_VERSION: '8'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ClearWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Widget/WeatherService.swift
      - path: Widget/WidgetLocation.swift
      - path: Widget/AppleWeatherInput.swift
      - path: Widget/AppleWeatherIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.app
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "\u2800"
        CFBundleShortVersionString: "0.5.2"
        CFBundleVersion: "8"
        NSLocationWhenInUseUsageDescription: "ClearWidget usa tu ubicación solo para consultar el clima del lugar donde estés."
        UILaunchScreen: {}
    dependencies:
      - target: ClearWidgetExtension
        embed: true
        codeSign: false
  ClearWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.app.widget
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "\u2800"
        CFBundleShortVersionString: "0.5.2"
        CFBundleVersion: "8"
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: "Ubicación aproximada para consultar el clima local."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  ClearWidget:
    build:
      targets:
        ClearWidget: all
