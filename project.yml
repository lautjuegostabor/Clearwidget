name: ClearWidget
options:
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '4'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ClearWidget:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.app
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ClearWidget
        UILaunchScreen: {}
    dependencies:
      - target: ClearWidgetExtension
        embed: true
        codeSign: false
  ClearWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.app.widget
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ClearWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  ClearWidget:
    build:
      targets:
        ClearWidget: all
