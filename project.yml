name: ClearWidget
options:
  developmentLanguage: es
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.5.21'
    CURRENT_PROJECT_VERSION: '27'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ClearWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Widget/WeatherService.swift
      - path: Widget/WidgetLocation.swift
      - path: Widget/AppleWeatherInput.swift
      - path: Widget/ShortcutBridge.swift
      - path: Widget/ActivityData.swift
      - path: Widget/WidgetInteraction.swift
      - path: Widget/ShortcutReceipt.swift
      - path: Widget/AppearancePreference.swift
      - path: Widget/AppearanceState.swift
      - path: Widget/AppearanceNotify.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.app
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLEARWIDGET_HOST"
        TARGETED_DEVICE_FAMILY: '1'
        OTHER_LDFLAGS: ['$(inherited)', '$(PROJECT_DIR)/Signing/Native/libclearsign.a', '-framework', 'Security', '-framework', 'SystemConfiguration', '-framework', 'CoreFoundation', '-liconv', '-lresolv', '-lz', '-lc++']
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "\u2800"
        CFBundleName: ClearWidget
        CFBundleSpokenName: ClearWidget
        CFBundleDevelopmentRegion: es
        INAlternativeAppNames:
          - INAlternativeAppName: ClearWidget
        CFBundleShortVersionString: "0.5.21"
        CFBundleVersion: "27"
        NSLocationWhenInUseUsageDescription: "ClearWidget usa tu ubicación solo para consultar el clima del lugar donde estés."
        UILaunchScreen: {}
        BGTaskSchedulerPermittedIdentifiers: [com.clearwidget.app.clearsign]
        UIBackgroundModes: [processing]
        NSLocalNetworkUsageDescription: "ClearWidget anuncia temporalmente un emparejamiento propio, solo si lo autorizás."
        NSBonjourServices: ['_remotepairing-pairable-host._tcp']
        NSFaceIDUsageDescription: "Autorizá la creación local de un respaldo cifrado de ClearSign."
    dependencies:
      - target: ClearWidgetExtension
        embed: true
        codeSign: false
  ClearWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/AppleWeatherIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.app.widget
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        CLANG_ENABLE_OBJC_ARC: 'YES'
        SWIFT_OBJC_BRIDGING_HEADER: Widget/GlassDescriptorHook.h
        SKIP_INSTALL: 'YES'
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "\u2800"
        CFBundleShortVersionString: "0.5.21"
        CFBundleVersion: "27"
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: "Ubicación aproximada para consultar el clima local."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  ClearWidget:
    build:
      targets:
        ClearWidget: all
