name: Native Material Lab
on:
  workflow_dispatch:
  push:
    branches: [research/native-material-lab]
permissions:
  contents: read
jobs:
  lab:
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Research/NativeMaterialLab
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          choices=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              p=app+'/Contents/Developer'
              out=subprocess.run(['xcodebuild','-version'], env=dict(os.environ,DEVELOPER_DIR=p),capture_output=True,text=True).stdout
              m=re.search(r'Xcode (\d+(?:\.\d+)*)',out)
              if m and int(m[1].split('.')[0]) >= 27: choices.append((tuple(map(int,m[1].split('.'))),p))
          assert choices, 'Xcode 27 required'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVELOPER_DIR='+max(choices)[1]+'\n')
          PY
      - name: Check fixed kind scope and native SDK syntax
        run: |
          xcrun --sdk macosx clang -DCW_LAB_TEST -fobjc-arc -fblocks -framework Foundation Widget/NativeDescriptorLab.m Tests/StyleTests.m -o /tmp/cw-lab-test
          /tmp/cw-lab-test
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=27.0 -fobjc-arc -fblocks -fapplication-extension -fsyntax-only Widget/NativeDescriptorLab.m
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=27.0 -fobjc-arc -fsyntax-only -Wall -Wextra App/RuntimeInventory.m
      - name: Build independent project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 - <<'PY'
          import plistlib
          for path in ('App/Info.plist','Widget/Info.plist'):
              with open(path,'rb') as f: p=plistlib.load(f)
              assert p.get('CFBundleShortVersionString')=='0.1.2' and p.get('CFBundleVersion')=='3', (path,p)
          PY
          xcodebuild -project NativeMaterialLab.xcodeproj -scheme NativeMaterialLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify package
        run: |
          app=build/Build/Products/Release-iphoneos/NativeMaterialLab.app
          ext="$app/PlugIns/NativeMaterialLabExtension.appex"
          test -f "$ext/NativeMaterialLabExtension"
          python3 - "$app" "$ext" <<'PY'
          import pathlib, plistlib, sys
          for p,b in zip(sys.argv[1:],('com.clearwidget.materiallab','com.clearwidget.materiallab.widget')):
              info=plistlib.loads((pathlib.Path(p)/'Info.plist').read_bytes())
              print(b, info.get('CFBundleShortVersionString'), info.get('CFBundleVersion'))
              assert info['CFBundleIdentifier']==b, (p, info.get('CFBundleIdentifier'))
              assert info['CFBundleShortVersionString']=='0.1.2' and info['CFBundleVersion']=='3', (p, info.get('CFBundleShortVersionString'), info.get('CFBundleVersion'))
          bin=(pathlib.Path(sys.argv[2])/'NativeMaterialLabExtension').read_bytes()
          for kind in (b'CWLabSystem',b'CWLabClear',b'CWLabBlur',b'CWLabGlass',b'CWLabGlassOnClear',b'CWLabGlassOnBlur'): assert kind in bin
          assert b'glassEffect' in bin, 'native glass modifier missing'
          PY
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry NativeMaterialLab-0.1.2.ipa Payload
          unzip -t NativeMaterialLab-0.1.2.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NativeMaterialLab-0.1.2
          path: Research/NativeMaterialLab/NativeMaterialLab-0.1.2.ipa
          if-no-files-found: error
