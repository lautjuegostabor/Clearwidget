name: Build ClearWidget IPA
on:
  workflow_dispatch:
  push:
    branches: [main, v0.5-integration, v0.5.2-integration, v0.5.3-integration, v0.5.4-integration, v0.5.5-integration, v0.5.6-integration, v0.5.7-integration]
permissions:
  contents: read
concurrency:
  group: clearwidget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 27 SDK or newer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, os
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              env = dict(os.environ, DEVELOPER_DIR=developer)
              p = subprocess.run(['xcodebuild','-version'], env=env, text=True, capture_output=True)
              match = re.search(r'Xcode (\d+(?:\.\d+)*)', p.stdout)
              if match and int(match.group(1).split('.')[0]) >= 27:
                  candidates.append((tuple(map(int, match.group(1).split('.'))), developer))
          if not candidates:
              raise SystemExit('Xcode 27 or newer is required for direct application actions')
          selected = max(candidates)[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + selected + '\n')
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test weather cache and forecast selection
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 Widget/WeatherService.swift Widget/WidgetLocation.swift Widget/AppleWeatherInput.swift Widget/GlassSmallForecast.swift Widget/ActivityData.swift Tests/WeatherTests.swift -o /tmp/clearwidget-weather-tests
          /tmp/clearwidget-weather-tests
      - name: Test interaction fast path
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 Widget/WidgetInteraction.swift Tests/InteractionTests.swift -o /tmp/clearwidget-interaction-tests
          /tmp/clearwidget-interaction-tests
      - name: Generate exact local artwork
        run: |
          python3 -m venv /tmp/clearwidget-assets
          /tmp/clearwidget-assets/bin/pip install 'Pillow>=11,<13'
          /tmp/clearwidget-assets/bin/python Tools/generate_assets.py
      - name: Check live ECMWF response
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --get 'https://api.open-meteo.com/v1/forecast' \
            --data-urlencode 'latitude=-31.4167' --data-urlencode 'longitude=-64.1833' \
            --data-urlencode 'models=ecmwf_ifs' --data-urlencode 'current=temperature_2m,weather_code,is_day' \
            --data-urlencode 'hourly=temperature_2m,weather_code,is_day' --data-urlencode 'forecast_days=3' \
            --data-urlencode 'timezone=America/Argentina/Cordoba' --data-urlencode 'timeformat=unixtime' -o /tmp/forecast.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/forecast.json'))
          h=x['hourly']
          assert len(h['time']) >= 48
          assert all(len(h[k])==len(h['time']) for k in ['temperature_2m','weather_code','is_day'])
          assert isinstance(h['time'][0],int) and any(v is not None for v in h['temperature_2m'])
          assert isinstance(x['current']['time'],int)
          print('ECMWF response schema verified')
          PY
      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build pinned ClearSign static library
        run: bash Tools/build_clearsign.sh
      - name: Generate project and build
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcodegen generate
          xcodebuild -project ClearWidget.xcodeproj -scheme ClearWidget -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify and package unsigned IPA
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/ClearWidget.app
          ext="$app/PlugIns/ClearWidgetExtension.appex"
          test -f "$app/ClearWidget"
          test -f "$ext/ClearWidgetExtension"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$ext/Info.plist" | grep -Fx com.apple.widgetkit-extension
          python3 - "$app" "$ext" <<'PY'
          import sys, plistlib, pathlib
          for path, bundle in zip(sys.argv[1:], ["com.clearwidget.app", "com.clearwidget.app.widget"]):
              p = plistlib.loads((pathlib.Path(path) / "Info.plist").read_bytes())
              assert p["CFBundleIdentifier"] == bundle, p
              assert p["CFBundleShortVersionString"] == "0.5.7", p
              assert p["CFBundleVersion"] == "13", p
              assert p["CFBundleDisplayName"] == chr(0x2800), p
          print("Verified both final bundle identifiers, display names and versions")
          PY
          python3 Tools/check_shortcut_metadata.py "$app" "$ext"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry ClearWidget-v0.5.7.ipa Payload
          unzip -t ClearWidget-v0.5.7.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ClearWidget-v0.5.7
          path: ClearWidget-v0.5.7.ipa
          if-no-files-found: error

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Prepare local build dependencies
        run: |
          python3 -m venv /tmp/clearwidget-tools
          /tmp/clearwidget-tools/bin/pip install 'cryptography>=44,<49' 'ziglang==0.15.2'
          echo "/tmp/clearwidget-tools/bin" >> "$GITHUB_PATH"
      - name: Verify capsule and signer patch
        run: |
          python3 Tools/verify_vendor.py Vendor
          python3 -m unittest discover -s Tests -p 'test_recovery_*.py'
          python3 Recovery/verify_signer_source.py /tmp/clearwidget-signer
      - name: Compile and test narrow signer (no account or device)
        run: |
          cd /tmp/clearwidget-signer
          cargo test --locked --bin baristore bridge_entitlements::tests
      - name: Build profile-only recovery for documented Open Minis target
        run: |
          bash Recovery/build_profile_recovery.sh aarch64-unknown-linux-musl
          file .clearrecovery-build/output/clearrecovery
      - uses: actions/upload-artifact@v4
        with:
          name: ClearRecovery-v0.5.7-experimental
          path: .clearrecovery-build/output/
          if-no-files-found: error
