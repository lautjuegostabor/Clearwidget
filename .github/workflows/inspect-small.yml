name: Inspect original small widget assets
on:
  push:
    branches: [v0.5-integration]
    paths: ['.github/workflows/inspect-small.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p icons
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/l5uszPIABjtFcowSYdiyukHqgd6SmcAfg2KuiCFD.png' -o icons/0.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/qz81wqOzqlhXMdI3F7wdRuiAHzaTHpjnyWA3kL57.png' -o icons/1.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/e16AjvFsyVknYN2jXwNYUG9iHVxnQitnIWDeU0xE.png' -o icons/2.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/LjDt6yhXuio1zCqqx69x7xSvyUcFWToxctO0z2PL.png' -o icons/3.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/at6h1sLS1pM8llCXnkwOtUIYWeZsBUOKd1Rhe202.png' -o icons/4.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/piji8PCnVmZLYXGjxz92ocULGTP71WbvOwdl06Fy.png' -o icons/5.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/CKKPt7hNnS0lxq7R9waJLSVxM7s6tG6a4OzlgBbE.png' -o icons/6.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/TkTUBhIVDvFcVAz31ZFGcHtxHPuNSA7ay4Etp7cm.png' -o icons/7.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/E6khoTlQxL6Rq9VsR3UjnGLjNHach4ZWxzKFvkVH.png' -o icons/8.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/IdV96DiFsgooXkBdYe4kAZpEGXS8v5duMK92uWhI.png' -o icons/9.png
          curl -fLsS --retry 2 --max-time 25 'https://widgy.fra1.digitaloceanspaces.com/images/Jb9qPVQTwDjXfFuz8ttylIAM7Fvacd0t2AxV907U.png' -o icons/10.png
      - uses: actions/upload-artifact@v4
        with:
          name: small-original-icons
          path: icons/
          if-no-files-found: error
          retention-days: 1
