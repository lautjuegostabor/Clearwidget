name: Check native Shortcut export signing
on:
  push:
    branches: [shortcut-export-signing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Create harmless offline signing probe
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          workflow = {
              "WFWorkflowClientVersion": "4000",
              "WFWorkflowMinimumClientVersion": 900,
              "WFWorkflowMinimumClientVersionString": "900",
              "WFWorkflowIcon": {"WFWorkflowIconStartColor": 4282601983, "WFWorkflowIconGlyphNumber": 59511},
              "WFWorkflowTypes": [],
              "WFWorkflowInputContentItemClasses": [],
              "WFWorkflowActions": [{"WFWorkflowActionIdentifier": "is.workflow.actions.gettext", "WFWorkflowActionParameters": {"WFTextActionText": "ClearWidget signing probe"}}],
          }
          Path("/tmp/probe.shortcut").write_bytes(plistlib.dumps(workflow, fmt=plistlib.FMT_BINARY))
          PY
      - name: Check Apple native signer without account setup
        run: |
          set -euo pipefail
          /usr/bin/shortcuts sign --mode anyone --input /tmp/probe.shortcut --output /tmp/signed-probe.shortcut
          test -s /tmp/signed-probe.shortcut
          python3 - <<'PY'
          from pathlib import Path
          data=Path("/tmp/signed-probe.shortcut").read_bytes()
          assert data[:4] == b"AEA1", "Unexpected signed container"
          print("Native Apple signing succeeded; no user credentials were supplied.")
          PY
