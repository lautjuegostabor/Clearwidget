name: NativeMaterialLab
options:
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  NativeMaterialLab:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.materiallab
        SWIFT_OBJC_BRIDGING_HEADER: App/RuntimeInventory.h
        CLANG_ENABLE_OBJC_ARC: 'YES'
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Material Lab
        UILaunchScreen: {}
    dependencies:
      - target: NativeMaterialLabExtension
        embed: true
        codeSign: false
  NativeMaterialLabExtension:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearwidget.materiallab.widget
        SWIFT_OBJC_BRIDGING_HEADER: Widget/NativeDescriptorLab.h
        CLANG_ENABLE_OBJC_ARC: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: 'YES'
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Material Lab
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  NativeMaterialLab:
    build:
      targets:
        NativeMaterialLab: all
